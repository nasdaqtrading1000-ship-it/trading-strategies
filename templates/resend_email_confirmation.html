{% extends "base.html" %}

{% block title %}Reenviar confirmacion{% endblock %}

{% block content %}
<section class="container py-5">
  <div class="login-panel mx-auto p-4 p-md-5">
    <p class="text-info fw-semibold mb-1">Email pendiente</p>
    <h1 class="h2 mb-2">Reenviar confirmacion</h1>
    <p class="text-secondary mb-4">
      Introduce el email de la cuenta y enviaremos otro enlace de confirmacion.
    </p>

    <form method="post" class="vstack gap-3">
      <div>
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" value="{{ email or '' }}" autocomplete="email" required>
      </div>
      <button class="btn btn-info fw-semibold" type="submit">Reenviar confirmacion</button>
    </form>

    <p class="text-secondary small mt-4 mb-0">
      Ya has confirmado?
      <a href="{{ url_for('user_login') }}">Entrar</a>
    </p>
  </div>
</section>
{% endblock %}
